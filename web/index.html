<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/brand/seorap-logo.svg" />
    <link rel="icon" type="image/png" href="/brand/seorap-logo.png" />
    <link rel="apple-touch-icon" href="/brand/seorap-logo.png" />
    <meta name="theme-color" content="#1E5552" />
    <title>인싸이트 서랍</title>
    <!-- 앱이 뜨기 전 첫 순간의 바탕색. 경로 규칙은 src/lib/pageSurface.ts 의 isClosedPath 와 같게 둔다 (입장·비밀번호 설정 = 청록) -->
    <script>
      (function () {
        var p = location.pathname
        var closed = p === '/pin' || (/^\/[^/]+$/.test(p) && ['/', '/box', '/help', '/pin'].indexOf(p) < 0)
        document.documentElement.style.backgroundColor = closed ? '#1E5552' : '#F6F2EA'
      })()
    </script>
    <!-- Pretendard 가변 서브셋을 비동기로 불러온다 (렌더 차단 금지, Booth 02_DESIGN_TOKENS) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />
    <style>
      input, select, textarea { color-scheme: light; }
      /* 제목 글꼴 리디바탕 (01-plan §0 10-29). 공개 저장소라 라이선스 확인 전에는 파일을 두지 않고 눈누 배포본을 쓴다.
         swap: 글꼴이 늦어도 제목이 본문 글꼴로 먼저 보인다 */
      @font-face {
        font-family: 'RIDIBatang';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
